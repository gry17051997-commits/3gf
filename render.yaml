services:
  - type: web
    name: grafik-pracy-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://grafik-pracy-c9006.web.app,https://grafik-pracy-c9006.firebaseapp.com
      - key: ALLOW_PUBLIC_REGISTER
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: grafik-pracy-db
          property: connectionString

databases:
  - name: grafik-pracy-db
    plan: free
    databaseName: grafik_pracy
    user: grafik_pracy
    region: frankfurt
