name: GPS Trip History Tests

on:
  push:
    branches:
      - feature/trip-history-analytics
    paths:
      - "backend/**"
      - ".github/workflows/trip-history-tests.yml"
  pull_request:
    branches:
      - backup/2026-10-17-working-maps-gps
    paths:
      - "backend/**"
      - ".github/workflows/trip-history-tests.yml"

permissions:
  contents: read

jobs:
  trip-history:
    name: Trip history unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify backend syntax
        run: node --check server.js
      - name: Run trip history tests
        run: node --test tripHistory.test.js
