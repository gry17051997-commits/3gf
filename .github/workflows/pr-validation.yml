name: PR Validation

# The test APK is published only after the real-app emulator smoke test passes.

on:
  pull_request:
    branches: ['main']
    paths:
      - 'GrafikPracy_Final/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: grafik-pracy-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  EXPO_NO_DOCTOR: "1"
  CI: "1"

jobs:
  validate:
    name: Validate Web + Android + Stage 3
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: GrafikPracy_Final

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Production hardening tests and syntax checks
        run: |
          node --check App.js
          node --check AppRuntime.js
          node --check index.js
          node --check LocationService.js
          node --check LiveLocationDashboard.js
          node --check apiClient.js
          node --check scheduleEngine.js
          npm test
      - name: Validate project configuration
        run: npx expo config --type public
      - name: Export web
        run: npx expo export --platform web --output-dir ci-dist
      - name: Verify web bundle
        run: |
          test -s ci-dist/index.html
          find ci-dist -type f | head -20
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --non-interactive
      - name: Verify Android native project
        run: |
          test -f android/gradlew
          test -f android/app/src/main/AndroidManifest.xml
