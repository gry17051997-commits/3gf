name: Android Runtime Diagnostics

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "GrafikPracy_Final/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: grafik-pracy-runtime-diagnostics
  cancel-in-progress: true

env:
  EXPO_NO_DOCTOR: "1"
  EXPO_NO_TELEMETRY: "1"
  CI: "1"
  EXPO_PUBLIC_API_URL: https://grafik-pracy-api-fra.onrender.com
  EXPO_PUBLIC_MAPTILER_KEY: ${{ secrets.EXPO_PUBLIC_MAPTILER_KEY }}

jobs:
  runtime_smoke:
    name: Real app Android emulator smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: GrafikPracy_Final

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: GrafikPracy_Final/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Static checks and regression suite
        run: |
          node --check App.js
          node --check AppRuntime.js
          node --check index.js
          node --check LocationService.js
          node --check LiveLocationDashboard.js
          node --check apiClient.js
          node --check scheduleEngine.js
          npm test

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Build standalone release APK from the real application
        working-directory: GrafikPracy_Final/android
        run: ./gradlew assembleRelease --no-daemon --console=plain --max-workers=2

      - name: Verify APK and embedded JavaScript bundle
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -Z1 "$APK" > "$RUNNER_TEMP/apk-entries.txt"
          grep -Eq '^classes[0-9]*\.dex$' "$RUNNER_TEMP/apk-entries.txt"
          grep -Eq '(^|/)index\.android\.bundle$|^assets/.*\.(hbc|bundle)$' "$RUNNER_TEMP/apk-entries.txt"
          sha256sum "$APK"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo usermod -aG kvm "$USER"
          ls -l /dev/kvm

      - name: Install and launch the real app on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -eu
            adb wait-for-device
            adb install -r "${{ github.workspace }}/GrafikPracy_Final/android/app/build/outputs/apk/release/app-release.apk"
            adb shell pm grant pl.grafikpracy.app android.permission.ACCESS_COARSE_LOCATION || true
            adb shell pm grant pl.grafikpracy.app android.permission.ACCESS_FINE_LOCATION || true
            adb logcat -c
            adb shell monkey -p pl.grafikpracy.app 1
            sleep 20
            adb shell uiautomator dump /sdcard/grafik-pracy-window.xml >/dev/null
            adb pull /sdcard/grafik-pracy-window.xml "${{ github.workspace }}/runtime-window.xml" >/dev/null
            adb logcat -d > "${{ github.workspace }}/runtime-logcat.txt"
            adb shell pidof pl.grafikpracy.app > "${{ github.workspace }}/runtime-pid.txt" || true
            adb shell dumpsys activity activities > "${{ github.workspace }}/runtime-activities.txt"
            echo "=== APP PROCESS ==="
            cat "${{ github.workspace }}/runtime-pid.txt"
            test -s "${{ github.workspace }}/runtime-pid.txt"
            echo "=== REAL APP UI ==="
            cat "${{ github.workspace }}/runtime-window.xml"
            # Assert the real authentication UI was rendered; no test App.js is substituted.
            grep -Eiq 'ZALOGUJ SIĘ|E-mail|Hasło|Zaloguj się, aby korzystać ze wspólnego grafiku' "${{ github.workspace }}/runtime-window.xml"
            echo "REAL APP AUTHENTICATION UI FOUND"
            echo "=== APP FATAL ERRORS ==="
            node -e 'const fs=require("fs"); const p="${{ github.workspace }}/runtime-logcat.txt"; const s=fs.readFileSync(p,"utf8"); const re=/FATAL EXCEPTION|Unable to load script|ReactNativeJS.*(Error|Exception)|Invariant Violation|TurboModuleRegistry.*could not be found/; if(re.test(s)){console.error(s.split("\\n").filter(x=>re.test(x)).join("\\n")); process.exit(1)} console.log("NO APP FATAL ERRORS FOUND")'
            # The embedded app must survive background/foreground transitions.
            adb shell input keyevent 3
            sleep 3
            adb shell monkey -p pl.grafikpracy.app 1
            sleep 5
            adb shell pidof pl.grafikpracy.app > "${{ github.workspace }}/runtime-pid-resumed.txt"
            test -s "${{ github.workspace }}/runtime-pid-resumed.txt"
            adb logcat -d > "${{ github.workspace }}/runtime-logcat.txt"
            echo "REAL APP START + RESUME PASSED"

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-app-android-emulator-diagnostics
          path: |
            ${{ github.workspace }}/runtime-window.xml
            ${{ github.workspace }}/runtime-logcat.txt
            ${{ github.workspace }}/runtime-pid.txt
            ${{ github.workspace }}/runtime-pid-resumed.txt
            ${{ github.workspace }}/runtime-activities.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload verified test APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Grafik-Pracy-Test-APK
          path: ${{ github.workspace }}/GrafikPracy_Final/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
